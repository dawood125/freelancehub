name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      - name: Install server dependencies
        run: |
          cd server
          npm install --omit=dev --no-audit --no-fund

      - name: Install client dependencies
        run: |
          cd client
          npm install --no-audit --no-fund

      - name: Build client
        run: |
          cd client
          npm run build

      - name: Create deployment package
        run: |
          echo "📦 Creating deployment package..."
          mkdir -p deploy-package
          # Copy server files (excluding node_modules and .env for security)
          cp -r server/src deploy-package/src
          cp server/package.json deploy-package/package.json
          cp server/server.js deploy-package/server.js
          # Copy client build
          cp -r client/dist deploy-package/client-dist
          echo "✅ Deployment package created"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy files to EC2
        run: |
          echo "📤 Copying files to server..."
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r deploy-package/* ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/freelancehub-deploy/
          echo "✅ Files copied"

      - name: Deploy on EC2
        run: |
          echo "🚀 Starting deployment on server..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} << 'DEPLOY_SCRIPT'
            set -e
            echo "🔧 Server deployment starting..."

            # Backup current deployment
            if [ -d "/home/ubuntu/freelancehub-current" ]; then
              echo "📦 Backing up current version..."
              rm -rf /home/ubuntu/freelancehub-backup
              mv /home/ubuntu/freelancehub-current /home/ubuntu/freelancehub-backup
            fi

            # Promote new deployment
            echo "🔄 Activating new deployment..."
            rm -rf /home/ubuntu/freelancehub-current
            mv /home/ubuntu/freelancehub-deploy /home/ubuntu/freelancehub-current

            # Setup .env if not present in deployment
            if [ ! -f "/home/ubuntu/freelancehub-current/server/.env" ]; then
              if [ -f "/home/ubuntu/freelancehub-backup/server/.env" ]; then
                echo "♻️  Restoring .env from backup..."
                cp /home/ubuntu/freelancehub-backup/server/.env /home/ubuntu/freelancehub-current/server/.env
              fi
            fi

            # Install server dependencies
            echo "📥 Installing server dependencies..."
            cd /home/ubuntu/freelancehub-current/server
            npm install --omit=dev --no-audit --no-fund

            # Move client build to proper location
            echo "🎨 Setting up client..."
            cd /home/ubuntu/freelancehub-current
            if [ -d "client-dist" ]; then
              rm -rf client
              mv client-dist client
            fi

            # Restart with PM2
            echo "♻️  Restarting application..."
            pm2 delete freelancehub-api 2>/dev/null || true
            pm2 start server.js --name "freelancehub-api"
            pm2 save

            # Reload nginx
            echo "🌐 Reloading Nginx..."
            sudo systemctl reload nginx

            # Health check
            echo "🏥 Running health check..."
            sleep 3
            if pm2 status | grep -q "online"; then
              echo "✅ Deployment successful! Application is online."
              pm2 status
            else
              echo "❌ Health check failed! Rolling back..."
              pm2 delete freelancehub-api 2>/dev/null || true
              if [ -d "/home/ubuntu/freelancehub-backup/server" ]; then
                cd /home/ubuntu/freelancehub-backup/server
                pm2 start server.js --name "freelancehub-api"
                cd /home/ubuntu
                rm -rf freelancehub-current
                mv freelancehub-backup freelancehub-current
              fi
              exit 1
            fi

            # Cleanup
            if [ -d "/home/ubuntu/freelancehub-backup" ]; then
              echo "🧹 Cleaning up old backup..."
              rm -rf /home/ubuntu/freelancehub-backup
            fi

            echo "🎉 Deployment completed successfully!"
          DEPLOY_SCRIPT
          echo "✅ Server deployment done"
