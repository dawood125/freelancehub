name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      - name: Install server dependencies
        run: |
          cd server
          npm install --omit=dev --no-audit --no-fund

      - name: Install client dependencies
        run: |
          cd client
          npm install --no-audit --no-fund

      - name: Build client
        run: |
          cd client
          npm run build

      - name: Create deployment package
        run: |
          echo "📦 Creating deployment package..."
          mkdir -p deploy-package
          # Copy server files (excluding node_modules and .env for security)
          cp -r server/src deploy-package/src
          cp server/package.json deploy-package/package.json
          cp server/server.js deploy-package/server.js
          # Copy client build
          cp -r client/dist deploy-package/client-dist
          echo "✅ Deployment package created"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy files to EC2
        run: |
          echo "📤 Copying files to server..."
          # Clean up old deploy folder first
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} "rm -rf /home/ubuntu/freelancehub-deploy && mkdir -p /home/ubuntu/freelancehub-deploy"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r deploy-package/* ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/freelancehub-deploy/
          echo "✅ Files copied"

      - name: Deploy on EC2
        run: |
          echo "🚀 Starting deployment on server..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} << 'DEPLOY_SCRIPT'
            set -e
            echo "🔧 Server deployment starting..."

            # Working directory
            APP_DIR="/home/ubuntu/freelancehub"
            DEPLOY_DIR="/home/ubuntu/freelancehub-deploy"
            BACKUP_DIR="/home/ubuntu/freelancehub-backup"

            # Check if app directory exists
            if [ ! -d "$APP_DIR" ]; then
              echo "📁 Creating app directory: $APP_DIR"
              mkdir -p "$APP_DIR"
            fi

            # Backup current .env file
            if [ -f "$APP_DIR/server/.env" ]; then
              echo "💾 Backing up .env file..."
              cp "$APP_DIR/server/.env" /tmp/env-backup
            fi

            # Backup current deployment (optional, for rollback)
            if [ -d "$APP_DIR" ] && [ "$(ls -A $APP_DIR 2>/dev/null)" ]; then
              echo "📦 Backing up current version..."
              rm -rf "$BACKUP_DIR"
              cp -r "$APP_DIR" "$BACKUP_DIR" 2>/dev/null || true
            fi

            # Stop PM2 process before deploying
            echo "⏸️  Stopping current app..."
            pm2 stop freelancehub-api 2>/dev/null || true

            # Update server code (keep .env and node_modules)
            echo "🔄 Updating server code..."
            rm -rf "$APP_DIR/server/src"
            cp -r "$DEPLOY_DIR/src" "$APP_DIR/server/src"
            cp "$DEPLOY_DIR/package.json" "$APP_DIR/server/package.json"
            cp "$DEPLOY_DIR/server.js" "$APP_DIR/server/server.js"

            # Install/update server dependencies
            echo "📥 Installing server dependencies..."
            cd "$APP_DIR/server"
            npm install --omit=dev --no-audit --no-fund

            # Restore .env file (CRITICAL - never overwrite)
            if [ -f /tmp/env-backup ]; then
              echo "♻️  Restoring .env file..."
              cp /tmp/env-backup "$APP_DIR/server/.env"
              rm /tmp/env-backup
            fi

            # Update client build
            echo "🎨 Updating client build..."
            rm -rf "$APP_DIR/client/dist"
            mkdir -p "$APP_DIR/client"
            cp -r "$DEPLOY_DIR/client-dist" "$APP_DIR/client/dist"

            # Clean up deploy folder
            rm -rf "$DEPLOY_DIR"

            # Start application with PM2
            echo "♻️  Starting application..."
            cd "$APP_DIR/server"
            pm2 start server.js --name "freelancehub-api" || pm2 restart freelancehub-api
            pm2 save

            # Reload nginx
            echo "🌐 Reloading Nginx..."
            sudo systemctl reload nginx

            # Health check
            echo "🏥 Running health check..."
            sleep 3
            if pm2 status | grep -q "online"; then
              echo "✅ Deployment successful! Application is online."
              pm2 status
            else
              echo "❌ Health check failed! Rolling back..."
              if [ -d "$BACKUP_DIR/server" ]; then
                rm -rf "$APP_DIR/server"
                cp -r "$BACKUP_DIR/server" "$APP_DIR/server"
                cd "$APP_DIR/server"
                pm2 restart freelancehub-api
              fi
              exit 1
            fi

            # Cleanup old backup
            if [ -d "$BACKUP_DIR" ]; then
              echo "🧹 Cleaning up old backup..."
              rm -rf "$BACKUP_DIR"
            fi

            echo "🎉 Deployment completed successfully!"
          DEPLOY_SCRIPT
          echo "✅ Server deployment done"
